name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            suffix: AppleSilicon
          - runner: macos-15-intel
            suffix: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore cached FFmpeg
        uses: actions/cache@v4
        id: cache-ffmpeg
        with:
          path: vendor
          key: ffmpeg-${{ matrix.runner }}-${{ hashFiles('scripts/build_ffmpeg.sh') }}

      - name: Install nasm
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: brew install nasm

      - name: Build minimal FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: bash scripts/build_ffmpeg.sh "$PWD/vendor"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build DiscTag.app
        run: python build_app.py

      - name: Ad-hoc sign application
        run: |
          codesign --deep --force --sign - dist/DiscTag.app
          codesign --verify --deep --strict --verbose=2 dist/DiscTag.app

      - name: Create DMG
        run: hdiutil create -volname DiscTag -srcfolder dist/DiscTag.app -ov -format UDZO "dist/DiscTag-macOS-${{ matrix.suffix }}.dmg"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: DiscTag-macOS-${{ matrix.suffix }}
          path: dist/DiscTag-macOS-${{ matrix.suffix }}.dmg
          if-no-files-found: error
          retention-days: 30
