name: Build macOS

# 正式发布由 release.yml 完成（含 macOS 构建）；此工作流仅保留手动触发，用于单独试构建。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            suffix: AppleSilicon
          - runner: macos-15-intel
            suffix: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Fetch pinned FFmpeg
        run: python scripts/fetch_ffmpeg.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build DiscTag.app
        run: python build_app.py

      - name: Ad-hoc sign application
        run: |
          codesign --deep --force --sign - dist/DiscTag.app
          codesign --verify --deep --strict --verbose=2 dist/DiscTag.app

      - name: Create DMG
        # 托管 macOS runner 上 hdiutil 偶尔报 “Resource busy”（后台扫描占用文件），重试即可。
        run: |
          for attempt in 1 2 3; do
            if hdiutil create -volname DiscTag -srcfolder dist/DiscTag.app -ov -format UDZO "dist/DiscTag-macOS-${{ matrix.suffix }}.dmg"; then
              exit 0
            fi
            echo "hdiutil failed (attempt $attempt), retrying..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: DiscTag-macOS-${{ matrix.suffix }}
          path: dist/DiscTag-macOS-${{ matrix.suffix }}.dmg
          if-no-files-found: error
          retention-days: 30
