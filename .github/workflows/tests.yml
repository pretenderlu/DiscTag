name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Fetch pinned FFmpeg
        run: python scripts/fetch_ffmpeg.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run regression tests (including real FFmpeg conversion)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export DISCTAG_FFMPEG="$PWD/vendor/ffmpeg.exe"; else export DISCTAG_FFMPEG="$PWD/vendor/ffmpeg"; fi
          python -m unittest discover -s tests -v
